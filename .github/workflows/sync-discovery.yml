name: Sync docs and website discovery

# When skill files change on main, regenerate the docs pages and the website's
# agent-skills index from them (scripts/export-discovery.mjs) and open or update
# one PR in each repo, pinned to this commit. Merging those PRs stays manual.
#
# Needs the DISCOVERY_SYNC_TOKEN secret: a token that can push branches and open
# PRs in Pen-and-Paper-AI/userintuition-docs and Pen-and-Paper-AI/userintuition-website.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/user-intuition-research/skills/**'
      - 'skill-metadata.json'
      - 'scripts/export-discovery.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-discovery
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Check out the docs
        uses: actions/checkout@v4
        with:
          repository: Pen-and-Paper-AI/userintuition-docs
          path: docs-repo
          token: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
      - name: Check out the website discovery folder
        uses: actions/checkout@v4
        with:
          repository: Pen-and-Paper-AI/userintuition-website
          path: website-repo
          token: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
          sparse-checkout: public/.well-known
      - run: node scripts/export-discovery.mjs --docs docs-repo --website website-repo
      - name: Open or update the sync PRs
        env:
          GH_TOKEN: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
        run: |
          sync() {
            local dir=$1 repo=$2 branch=sync/user-intuition-skills
            if [ -z "$(git -C "$dir" status --porcelain)" ]; then
              echo "$repo is already in sync"
              return
            fi
            git -C "$dir" config user.name "github-actions[bot]"
            git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$dir" checkout -B "$branch"
            git -C "$dir" add -A
            git -C "$dir" commit -m "Sync User Intuition skills from user-intuition/skills@${GITHUB_SHA::7}"
            git -C "$dir" push --force origin "$branch"
            if [ "$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq length)" = 0 ]; then
              gh pr create --repo "$repo" --head "$branch" --base main \
                --title "Sync User Intuition skills" \
                --body "Generated by \`scripts/export-discovery.mjs\` in [user-intuition/skills](https://github.com/user-intuition/skills/commit/${GITHUB_SHA}) after skill files changed on main. Pinned to that commit. Don't edit by hand; the next sync overwrites this branch."
            else
              echo "Updated the open sync PR in $repo"
            fi
          }
          sync docs-repo Pen-and-Paper-AI/userintuition-docs
          sync website-repo Pen-and-Paper-AI/userintuition-website
