name: Sync docs, website and ChatGPT plugin

# When skill files change on main, regenerate the docs pages and the website's
# agent-skills index from them (scripts/export-discovery.mjs), copy the skills into
# the ChatGPT/Codex plugin package (the MCP server repo's scripts/sync-openai-skills.mjs),
# and open or update one PR in each repo, pinned to this commit. The docs PR merges
# itself once the docs repo's drift check passes; the website and MCP server PRs
# stay manual.
#
# Needs the DISCOVERY_SYNC_TOKEN secret: a token that can push branches, open
# and merge PRs in Pen-and-Paper-AI/userintuition-docs, Pen-and-Paper-AI/userintuition-website
# and Pen-and-Paper-AI/userintuition-mcpserver-ts.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/user-intuition-research/skills/**'
      - 'plugins/user-intuition-research/references/**'
      - 'skill-metadata.json'
      - 'scripts/export-discovery.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-discovery
  cancel-in-progress: true

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Check out the docs
        uses: actions/checkout@v4
        with:
          repository: Pen-and-Paper-AI/userintuition-docs
          path: docs-repo
          token: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
      - name: Check out the website discovery folder
        uses: actions/checkout@v4
        with:
          repository: Pen-and-Paper-AI/userintuition-website
          path: website-repo
          token: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
          sparse-checkout: public/.well-known
      - run: node scripts/export-discovery.mjs --docs docs-repo --website website-repo
      - name: Open or update the sync PRs
        env:
          GH_TOKEN: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
        run: |
          sync() {
            local dir=$1 repo=$2 branch=sync/user-intuition-skills
            if [ -z "$(git -C "$dir" status --porcelain)" ]; then
              echo "$repo is already in sync"
              return
            fi
            git -C "$dir" config user.name "github-actions[bot]"
            git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$dir" checkout -B "$branch"
            git -C "$dir" add -A
            git -C "$dir" commit -m "Sync User Intuition skills from user-intuition/skills@${GITHUB_SHA::7}"
            git -C "$dir" push --force origin "$branch"
            if [ "$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq length)" = 0 ]; then
              gh pr create --repo "$repo" --head "$branch" --base main \
                --title "Sync User Intuition skills" \
                --body "Generated by \`scripts/export-discovery.mjs\` in [user-intuition/skills](https://github.com/user-intuition/skills/commit/${GITHUB_SHA}) after skill files changed on main. Pinned to that commit. Don't edit by hand; the next sync overwrites this branch."
            else
              echo "Updated the open sync PR in $repo"
            fi
          }
          sync docs-repo Pen-and-Paper-AI/userintuition-docs
          sync website-repo Pen-and-Paper-AI/userintuition-website
      - name: Auto-merge the docs sync PR once its drift check passes
        # Docs pages are generated and never hand-edited, so a human merge only adds lag
        # (PR #172 sat 18 days). Fail closed: merge only when the docs repo's `drift`
        # check succeeded on this exact head commit; otherwise leave the PR open and fail
        # this step so the red run surfaces. Website and MCP server PRs stay manual (the
        # website needs `npm run deploy`; an MCP server merge deploys production).
        env:
          GH_TOKEN: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
        run: |
          repo=Pen-and-Paper-AI/userintuition-docs branch=sync/user-intuition-skills
          pr=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open docs sync PR to merge"
            exit 0
          fi
          sha=$(gh pr view "$pr" --repo "$repo" --json headRefOid --jq .headRefOid)
          state=""
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/$repo/commits/$sha/check-runs?check_name=drift" \
              --jq '.check_runs | sort_by(.started_at) | last | if . == null then "missing" else "\(.status)/\(.conclusion)" end')
            case "$state" in
              completed/success) break ;;
              completed/*) echo "::error::drift check on $repo#$pr ended $state; leaving the PR open for review"; exit 1 ;;
            esac
            sleep 10
          done
          if [ "$state" != "completed/success" ]; then
            echo "::error::drift check on $repo#$pr did not pass within 15 minutes (last state: $state); leaving the PR open"
            exit 1
          fi
          gh pr merge "$pr" --repo "$repo" --squash --match-head-commit "$sha"
          echo "Merged $repo#$pr at ${sha::7}"

  openai-plugin:
    # Runs after the sync job's npm test, so it never pushes skills that fail validation.
    needs: sync
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: skills
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check out the MCP server
        uses: actions/checkout@v4
        with:
          repository: Pen-and-Paper-AI/userintuition-mcpserver-ts
          path: mcpserver-repo
          token: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
      - name: Sync the skills and open or update the PR
        working-directory: mcpserver-repo
        env:
          GH_TOKEN: ${{ secrets.DISCOVERY_SYNC_TOKEN }}
        run: |
          repo=Pen-and-Paper-AI/userintuition-mcpserver-ts branch=sync/user-intuition-skills
          if [ ! -f scripts/sync-openai-skills.mjs ]; then
            echo "::warning::$repo has no scripts/sync-openai-skills.mjs yet; skipped the ChatGPT plugin sync"
            exit 0
          fi
          node scripts/sync-openai-skills.mjs --from "$GITHUB_WORKSPACE/skills"
          if [ -z "$(git status --porcelain)" ]; then
            echo "$repo is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "Sync User Intuition skills from user-intuition/skills@${GITHUB_SHA::7}"
          git push --force origin "$branch"
          if [ "$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq length)" = 0 ]; then
            gh pr create --repo "$repo" --head "$branch" --base main \
              --title "Sync User Intuition skills into the ChatGPT plugin" \
              --body "Generated by \`scripts/sync-openai-skills.mjs\` from [user-intuition/skills](https://github.com/user-intuition/skills/commit/${GITHUB_SHA}) after skill files changed on main. Pinned to that commit. Don't edit \`openai-plugin/skills\` by hand; the next sync overwrites this branch."
          else
            echo "Updated the open sync PR in $repo"
          fi
